name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PW: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web files
        run: |
          mkdir -p www
          if [ -f "index (1).html" ]; then cp "index (1).html" www/index.html; else cp index.html www/index.html; fi
          cp script.js www/
          if [ -f "style (1).css" ]; then cp "style (1).css" www/style.css; cp "style (1).css" "www/style (1).css"; else cp style.css www/; fi
          sed -i 's|<head\([^>]*\)>|<head\1><style id="emex-boot">html{background:#0a0f1c}body{visibility:hidden}#eh,#eh *{visibility:visible}</style><script>setTimeout(function(){var s=document.getElementById("emex-boot");if(s)s.remove()},4000)</script>|I' www/index.html
          for f in emex-hub.js emex-pro.js emex-boost.js emex-share.js emex-pack-*.js emex-home.js emex-ref.js emex-launch.js emex-fit.js; do
            if [ -f "$f" ]; then
              cp "$f" www/
              sed -i "s#</body>#<script src=\"$f\"></script></body>#" www/index.html
              grep -q "$f" www/index.html || echo "<script src=\"$f\"></script>" >> www/index.html
            fi
          done
      - run: npm install
      - run: npx cap add android
      - name: Generate app icons
        run: |
          mkdir -p assets
          cp "$(ls icon-only*.png | head -n 1)" assets/icon-only.png
          cp "$(ls icon-foreground*.png | head -n 1)" assets/icon-foreground.png
          cp "$(ls icon-background*.png | head -n 1)" assets/icon-background.png
          npx @capacitor/assets generate --android
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - name: Decide signing
        id: sign
        run: |
          if [ -n "$PW" ] && [ -f release.jks.enc ]; then echo "on=true" >> "$GITHUB_OUTPUT"; else echo "on=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build signed release APK
        if: steps.sign.outputs.on == 'true'
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in release.jks.enc -out release.jks -pass env:PW
          (cd android && ./gradlew assembleRelease)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass env:PW --key-pass env:PW --out emex-calculator.apk aligned.apk
          "$BT/apksigner" verify emex-calculator.apk
          rm -f release.jks
      - name: Build debug APK (no signing key yet)
        if: steps.sign.outputs.on != 'true'
        run: |
          (cd android && ./gradlew assembleDebug)
          cp android/app/build/outputs/apk/debug/app-debug.apk emex-calculator.apk
      - uses: actions/upload-artifact@v4
        with:
          name: emex-calculator-apk
          path: emex-calculator.apk
