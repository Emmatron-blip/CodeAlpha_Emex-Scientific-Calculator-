name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web files
        run: |
          mkdir -p www
          if [ -f "index (1).html" ]; then cp "index (1).html" www/index.html; else cp index.html www/index.html; fi
          cp script.js www/
          if [ -f "style (1).css" ]; then cp "style (1).css" www/style.css; cp "style (1).css" "www/style (1).css"; else cp style.css www/; fi
      - run: npm install
      - run: npx cap add android
      - name: Generate app icons
        run: |
          mkdir -p assets
          cp "$(ls icon-only*.png | head -n 1)" assets/icon-only.png
          cp "$(ls icon-foreground*.png | head -n 1)" assets/icon-foreground.png
          cp "$(ls icon-background*.png | head -n 1)" assets/icon-background.png
          npx @capacitor/assets generate --android
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: emex-calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
