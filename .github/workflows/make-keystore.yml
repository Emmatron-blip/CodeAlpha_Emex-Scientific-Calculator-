name: Create signing key (run once)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  make-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create encrypted keystore
        env:
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then echo "ERROR: add the KEYSTORE_PASSWORD secret first"; exit 1; fi
          if [ -f release.jks.enc ]; then echo "A signing key already exists. Not overwriting it."; exit 1; fi
          keytool -genkeypair -keystore release.jks -alias emex -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=Emex Calculator, O=Emex, C=NG"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in release.jks -out release.jks.enc -pass env:PW
          rm -f release.jks
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add release.jks.enc
          git commit -m "Add encrypted signing key"
          git push
