<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d18">
  <meta name="description" content="A scientific calculator for students, engineers and technical calculations.">

  <title>CodeAlpha | Scientific Calculator</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="calculator">

    <!-- HEADER -->
    <header class="calculator-header">
      <div class="brand">
        <span class="brand-mark">Ex</span>

        <div>

          <h1>Emex Scientific Calculator</h1>
        </div>
      </div>

      <span class="status-indicator" aria-hidden="true"></span>
    </header>

    <!-- DISPLAY -->
    <section class="display" aria-label="Calculator display">

      <div class="display-top">
        <span id="mode-label">DEG</span>
        <span id="status-label">READY</span>
      </div>

      <div
        id="expression"
        class="expression"
        aria-label="Current expression"
      >0</div>

      <output
        id="result"
        class="result"
        aria-live="polite"
        aria-label="Calculation result"
      >0</output>

    </section>

    <!-- TOOLBAR -->
    <div class="toolbar">

      <button
        class="mode-button active"
        id="angle-toggle"
        type="button"
        aria-label="Switch angle mode"
      >DEG</button>

      <div class="format-control" aria-label="Number display format">

        <button
          class="format-button active"
          data-format="norm"
          type="button"
          aria-pressed="true"
        >NORM</button>

        <button
          class="format-button"
          data-format="sci"
          type="button"
          aria-pressed="false"
        >SCI</button>

        <button
          class="format-button"
          data-format="eng"
          type="button"
          aria-pressed="false"
        >ENG</button>

      </div>

      <button
        class="history-toggle"
        id="history-toggle"
        data-action="toggle-history"
        type="button"
        aria-expanded="false"
        aria-controls="history-panel"
      >
        <span aria-hidden="true">◷</span>
        History
      </button>

      <button
        class="utility-button"
        data-action="clear"
        type="button"
        aria-label="Clear calculator"
      >AC</button>

    </div>
    <!-- SLIDE-OUT HISTORY PANEL -->
    <aside
      class="history-panel"
      id="history-panel"
      aria-label="Calculation history"
      aria-hidden="true"
      hidden
    >

      <div class="history-header">

        <div>
          <p class="eyebrow">YOUR CALCULATIONS</p>
          <h2>History</h2>
        </div>

        <button
          class="history-close"
          data-action="toggle-history"
          type="button"
          aria-label="Close history"
        >✕</button>

      </div>

      <div class="history-actions">

        <span class="history-count" id="history-count">
          0 calculations
        </span>

        <button
          class="history-clear"
          data-action="clear-history"
          type="button"
        >Clear history</button>

      </div>

      <div
        class="history-list"
        id="history-list"
        aria-live="polite"
      >

        <div class="history-empty" id="history-empty">
          <span class="history-empty-icon" aria-hidden="true">◷</span>
          <p>No calculations yet</p>
          <span>Your completed calculations will appear here.</span>
        </div>

      </div>

      <p class="history-note">
        History is saved locally on this device.
      </p>

    </aside>

    <!-- SCIENTIFIC KEYPAD -->
    <section
      class="scientific-keypad"
      aria-label="Scientific functions"
    >

      <button class="key key-science" data-function="sin" type="button">sin</button>
      <button class="key key-science" data-function="cos" type="button">cos</button>
      <button class="key key-science" data-function="tan" type="button">tan</button>
      <button class="key key-science" data-function="asin" type="button">sin⁻¹</button>
      <button class="key key-science" data-function="acos" type="button">cos⁻¹</button>
      <button class="key key-science" data-function="atan" type="button">tan⁻¹</button>

      <button class="key key-science" data-function="log" type="button">log</button>
      <button class="key key-science" data-function="ln" type="button">ln</button>
      <button class="key key-science" data-function="sqrt" type="button">√</button>
      <button class="key key-science" data-function="square" type="button">x²</button>
      <button class="key key-science" data-function="power" type="button">xʸ</button>
      <button class="key key-science" data-function="factorial" type="button">x!</button>

      <button class="key key-science" data-value="π" type="button">π</button>
      <button class="key key-science" data-value="e" type="button">e</button>
      <button class="key key-science" data-value="(" type="button">(</button>
      <button class="key key-science" data-value=")" type="button">)</button>
      <button class="key key-science" data-function="reciprocal" type="button">1/x</button>
      <button class="key key-science" data-function="abs" type="button">|x|</button>

    </section>

    <!-- STANDARD KEYPAD -->
    <section
      class="standard-keypad"
      aria-label="Number keypad"
    >

      <button class="key key-function" data-action="clear" type="button">AC</button>
      <button class="key key-function" data-action="delete" type="button">DEL</button>
      <button class="key key-function" data-value="%" type="button">%</button>
      <button class="key key-operator" data-value="/" type="button">÷</button>

      <button class="key" data-value="7" type="button">7</button>
      <button class="key" data-value="8" type="button">8</button>
      <button class="key" data-value="9" type="button">9</button>
      <button class="key key-operator" data-value="*" type="button">×</button>

      <button class="key" data-value="4" type="button">4</button>
      <button class="key" data-value="5" type="button">5</button>
      <button class="key" data-value="6" type="button">6</button>
      <button class="key key-operator" data-value="-" type="button">−</button>

      <button class="key" data-value="1" type="button">1</button>
      <button class="key" data-value="2" type="button">2</button>
      <button class="key" data-value="3" type="button">3</button>
      <button class="key key-operator" data-value="+" type="button">+</button>

      <button class="key key-sign" data-action="sign" type="button">+/−</button>
      <button class="key" data-value="0" type="button">0</button>
      <button class="key" data-value="." type="button">.</button>
      <button class="key key-equals" data-action="calculate" type="button">=</button>

    </section>

    <!-- FOOTER -->
  
    
    </footer>

  </main>
</body>
</html>
